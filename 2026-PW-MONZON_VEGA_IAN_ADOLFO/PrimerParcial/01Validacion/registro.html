<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <header> <a href="detalle.html">Volver al Detalle del Taller</a> </header>

  <main> 
    <form class="formulario-registro" id="form-registro" novalidate>
      <h1 class="titulo-registro">Formulario de Registro de Asistencia</h1>

      <label for="nombre">Nombre Completo:</label><br>
      <input type="text" id="nombre" name="nombre" required><br>
      <span class="error" id="error-nombre" ></span>

      <label for="boleta">Número de Boleta:</label><br>
      <input type="text"" id="boleta" name="boleta" required><br>
      <span class="error" id="error-boleta"></span>

      <label for="fecha">Fecha de Registro (DD/MM/AAAA)</label>
      <input type="text" id="fecha" name="fecha" placeholder="DD/MM/AAAA">
      <span class="error" id="error-fecha"></span>

      <button type="submit">Registrar Asistencia</button>
      <p class="mensaje-exitoso" id="mensaje-exitoso"></p>
    </form>
  </main>
  <script src="./js/validaciones.js"></script>

</body>
</html>
